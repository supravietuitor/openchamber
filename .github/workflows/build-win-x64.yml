name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: false
        type: string
      opencode_run_id:
        description: 'OpenCode CI run ID for the custom CLI artifact'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build-win-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get version
        id: get_version
        shell: bash
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ -n "$RELEASE_INPUT_VERSION" ]]; then
            echo "version=$RELEASE_INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download custom OpenCode CLI
        if: ${{ inputs.opencode_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.opencode_run_id }}" \
            --repo supravietuitor/opencode \
            --name opencode-windows-custom \
            --dir custom-opencode-cli

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-x64-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-x64-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        env:
          OPENCHAMBER_OPENCODE_CLI_PATH: ${{ inputs.opencode_run_id != '' && format('{0}/custom-opencode-cli/opencode.exe', github.workspace) || '' }}
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          ELECTRON_BUILDER_ARCH: x64
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --win --x64 --publish=never
          bun run verify:opencode-cli:packaged

      - name: Upload installer to draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
